<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bronx Social Club — Mis Entradas</title>
<link rel="icon" href="/iconos/logo-bronx-cuadrado.png" type="image/png">
<link rel="apple-touch-icon" href="/iconos/logo-bronx-cuadrado.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body data-page="entradas">
<div class="grain-layer"></div>

<div class="demo-banner" id="demo-banner">
  ⚠️ <b>Modo demo:</b> Supabase todavía no está configurado. Los datos no se guardan.
</div>

<nav>
  <button class="logo" onclick="go('eventos')"><img src="/iconos/logo-bronx.png" alt="BRONX"></button>
  <div class="tabs">
    <button class="tab active" id="tab-eventos" onclick="go('eventos')">Eventos</button>
    <button class="tab" id="tab-entradas" onclick="go('entradas')">Mis Entradas<span class="badge" id="badge" style="display:none">0</span></button>
    <button class="tab" id="tab-admin" onclick="go('admin')" style="display:none">Admin</button>
  </div>
  <button class="nav-user" id="tab-cuenta" onclick="go('cuenta')">Ingresar</button>
</nav>

<!-- ============ PÁGINA: MIS ENTRADAS ============ -->
<div class="page show" id="page-entradas">
  <section>
    <h2>Mis Entradas</h2>
    <p class="sub" id="ent-sub">Tus entradas asociadas a tu cuenta.</p>
    <div id="ent-login-prompt" style="display:none" class="empty">
      <p>Iniciá sesión para ver tus entradas.</p>
      <button class="btn" onclick="go('cuenta')">Iniciar sesión</button>
    </div>
    <div id="my-tickets"></div>
  </section>
</div>

<footer>
  <img class="footer-logo" src="/iconos/logo-bronx.png" alt="BRONX">
  <p>Bronx Social Club · bronxcerveceria@outlook.com</p>
  <p style="margin-top:6px">Bronx Social Club — Casanova 888, Bahía Blanca — venta oficial</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
